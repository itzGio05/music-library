<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Library</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 900px; margin: 0 auto; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 12px; text-decoration: none; color: #333; }
        nav a.active { font-weight: bold; text-decoration: underline; }
        .page { display: none; }
        .page.active { display: block; }
        input, select { padding: 6px; margin: 4px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 6px 12px; margin: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; font-size: 14px; }
        th { background: #f5f5f5; }
    </style>
</head>
<body>

<nav>
    <a href="#" class="nav-link active" data-page="home">Home</a>
    <a href="#" class="nav-link" data-page="artists">Artists</a>
    <a href="#" class="nav-link" data-page="albums">Albums</a>
    <a href="#" class="nav-link" data-page="songs">Songs</a>
</nav>

<!-- HOME -->
<div id="home" class="page active">
    <h2>Music Library</h2>
    <p id="home-stats"></p>
</div>

<!-- ARTISTS -->
<div id="artists" class="page">
    <h2>Artists</h2>
    <input type="hidden" id="artist-id">
    <input type="text"   id="artist-name"      placeholder="Name">
    <input type="text"   id="artist-genre"     placeholder="Genre">
    <input type="number" id="artist-listeners" placeholder="Monthly Listeners">
    <button onclick="saveArtist()">Save</button>
    <button onclick="resetArtistForm()" id="artist-cancel" style="display:none">Cancel</button>
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Genre</th><th>Listeners</th><th></th></tr></thead>
        <tbody id="artists-tbody"></tbody>
    </table>
</div>

<!-- ALBUMS -->
<div id="albums" class="page">
    <h2>Albums</h2>
    <input type="hidden" id="album-id">
    <input type="text"   id="album-name"    placeholder="Name">
    <input type="number" id="album-year"    placeholder="Year">
    <input type="number" id="album-listens" placeholder="Listens">
    <select id="album-artist"></select>
    <button onclick="saveAlbum()">Save</button>
    <button onclick="resetAlbumForm()" id="album-cancel" style="display:none">Cancel</button>
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Artist</th><th>Year</th><th>Listens</th><th></th></tr></thead>
        <tbody id="albums-tbody"></tbody>
    </table>
</div>

<!-- SONGS -->
<div id="songs" class="page">
    <h2>Songs</h2>
    <input type="hidden" id="song-id">
    <input type="text"   id="song-name" placeholder="Name">
    <input type="number" id="song-year" placeholder="Year">
    <select id="song-album"></select>
    <button onclick="saveSong()">Save</button>
    <button onclick="resetSongForm()" id="song-cancel" style="display:none">Cancel</button>
    <table>
        <thead><tr><th>ID</th><th>Name</th><th>Album</th><th>Artist</th><th>Year</th><th></th></tr></thead>
        <tbody id="songs-tbody"></tbody>
    </table>
</div>

<script>
    const API = 'http://localhost:5000';

    // switch pages
    document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', e => {
            e.preventDefault();
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(link.dataset.page).classList.add('active');
            link.classList.add('active');
            if (link.dataset.page === 'artists') loadArtists();
            if (link.dataset.page === 'albums')  loadAlbums();
            if (link.dataset.page === 'songs')   loadSongs();
        });
    });

    // fetch wrapper
    async function api(method, path, body) {
        const res = await fetch(API + path, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: body ? JSON.stringify(body) : undefined
        });
        return res.json();
    }

    // ARTISTS
    async function loadArtists() {
        const artists = await api('GET', '/artists');
        document.getElementById('artists-tbody').innerHTML = artists.map(a => `
            <tr>
                <td>${a.id}</td>
                <td>${a.name}</td>
                <td>${a.genre || '-'}</td>
                <td>${a.monthly_listeners || '-'}</td>
                <td>
                    <button onclick="editArtist(${a.id}, '${escape(a.name)}', '${escape(a.genre||'')}', ${a.monthly_listeners||0})">Edit</button>
                    <button onclick="deleteArtist(${a.id})">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function saveArtist() {
        const id = document.getElementById('artist-id').value;
        const name = document.getElementById('artist-name').value.trim();
        const genre = document.getElementById('artist-genre').value.trim();
        const listeners = document.getElementById('artist-listeners').value;
        if (!name) return alert('Name is required');
        if (id) {
            await api('PUT', `/artists/${id}`, { name, genre, monthly_listeners: +listeners });
        } else {
            await api('POST', '/artists', { name, genre, monthly_listeners: +listeners });
        }
        resetArtistForm();
        loadArtists();
    }

    function editArtist(id, name, genre, listeners) {
        document.getElementById('artist-id').value        = id;
        document.getElementById('artist-name').value      = unescape(name);
        document.getElementById('artist-genre').value     = unescape(genre);
        document.getElementById('artist-listeners').value = listeners;
        document.getElementById('artist-cancel').style.display = '';
    }

    function resetArtistForm() {
        ['artist-id','artist-name','artist-genre','artist-listeners'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('artist-cancel').style.display = 'none';
    }

    async function deleteArtist(id) {
        if (!confirm('Delete artist? Albums and songs will also be deleted.')) return;
        await api('DELETE', `/artists/${id}`);
        loadArtists();
    }

    // ALBUMS
    async function loadAlbums() {
        const [albums, artists] = await Promise.all([api('GET', '/albums'), api('GET', '/artists')]);
        document.getElementById('album-artist').innerHTML = artists.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
        document.getElementById('albums-tbody').innerHTML = albums.map(a => `
            <tr>
                <td>${a.id}</td>
                <td>${a.name}</td>
                <td>${a.artist_name}</td>
                <td>${a.release_year || '-'}</td>
                <td>${a.listens || '-'}</td>
                <td>
                    <button onclick="editAlbum(${a.id}, '${escape(a.name)}', ${a.release_year||0}, ${a.listens||0}, ${a.artist_id})">Edit</button>
                    <button onclick="deleteAlbum(${a.id})">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function saveAlbum() {
        const id = document.getElementById('album-id').value;
        const name = document.getElementById('album-name').value.trim();
        const year = document.getElementById('album-year').value;
        const listens = document.getElementById('album-listens').value;
        const artistId = document.getElementById('album-artist').value;
        if (!name) return alert('Name is required');
        if (id) {
            await api('PUT', `/albums/${id}`, { name, release_year: +year, listens: +listens });
        } else {
            await api('POST', '/albums', { name, release_year: +year, listens: +listens, artist_id: +artistId });
        }
        resetAlbumForm();
        loadAlbums();
    }

    function editAlbum(id, name, year, listens, artistId) {
        document.getElementById('album-id').value      = id;
        document.getElementById('album-name').value    = unescape(name);
        document.getElementById('album-year').value    = year;
        document.getElementById('album-listens').value = listens;
        document.getElementById('album-artist').value  = artistId;
        document.getElementById('album-cancel').style.display = '';
    }

    function resetAlbumForm() {
        ['album-id','album-name','album-year','album-listens'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('album-cancel').style.display = 'none';
    }

    async function deleteAlbum(id) {
        if (!confirm('Delete album? Songs will also be deleted.')) return;
        await api('DELETE', `/albums/${id}`);
        loadAlbums();
    }

    // SONGS
    async function loadSongs() {
        const [songs, albums] = await Promise.all([api('GET', '/songs'), api('GET', '/albums')]);
        document.getElementById('song-album').innerHTML = albums.map(a => `<option value="${a.id}">${a.name}</option>`).join('');
        document.getElementById('songs-tbody').innerHTML = songs.map(s => `
            <tr>
                <td>${s.id}</td>
                <td>${s.name}</td>
                <td>${s.album_name}</td>
                <td>${s.artist_name}</td>
                <td>${s.release_year || '-'}</td>
                <td>
                    <button onclick="editSong(${s.id}, '${escape(s.name)}', ${s.release_year||0}, ${s.album_id})">Edit</button>
                    <button onclick="deleteSong(${s.id})">Delete</button>
                </td>
            </tr>
        `).join('');
    }

    async function saveSong() {
        const id = document.getElementById('song-id').value;
        const name = document.getElementById('song-name').value.trim();
        const year = document.getElementById('song-year').value;
        const albumId = document.getElementById('song-album').value;
        if (!name) return alert('Name is required');
        if (id) {
            await api('PUT', `/songs/${id}`, { name, release_year: +year });
        } else {
            await api('POST', '/songs', { name, release_year: +year, album_id: +albumId });
        }
        resetSongForm();
        loadSongs();
    }

    function editSong(id, name, year, albumId) {
        document.getElementById('song-id').value    = id;
        document.getElementById('song-name').value  = unescape(name);
        document.getElementById('song-year').value  = year;
        document.getElementById('song-album').value = albumId;
        document.getElementById('song-cancel').style.display = '';
    }

    function resetSongForm() {
        ['song-id','song-name','song-year'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('song-cancel').style.display = 'none';
    }

    async function deleteSong(id) {
        if (!confirm('Delete this song?')) return;
        await api('DELETE', `/songs/${id}`);
        loadSongs();
    }

    // home page stats
    Promise.all([api('GET', '/artists'), api('GET', '/albums'), api('GET', '/songs')]).then(([a, al, s]) => {
        document.getElementById('home-stats').textContent = `${a.length} artists · ${al.length} albums · ${s.length} songs`;
    });
</script>
</body>
</html>
